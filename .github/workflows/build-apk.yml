name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -m 1 "versionName" app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -m 1 "versionCode" app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate update_info.json
        run: |
          mkdir -p update
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_FILE")
          APK_SIZE=$(stat -c%s "$APK_FILE")
          APK_MD5=$(md5sum "$APK_FILE" | cut -d ' ' -f 1)
          CURRENT_TIME=$(date +%s%3N)
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/${APK_NAME}"
          
          cat <<EOF > update/update_info.json
          {
              "code": $VERSION_CODE,
              "name": "$VERSION_NAME",
              "filename": "$APK_NAME",
              "url": "$DOWNLOAD_URL",
              "time": $CURRENT_TIME,
              "des": "",
              "size": $APK_SIZE,
              "md5": "$APK_MD5"
          }
          EOF
          cat update/update_info.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Update Info Artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-info
          path: update/

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## 天音壁纸 ${{ steps.version.outputs.tag }}
            
            ### 下载
            - 下载下方 APK 文件安装即可
            
            ### 应用内更新
            - update_info.json 文件用于应用内更新功能
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Commit and Push Update Info
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add update/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update: update_info.json for ${{ steps.version.outputs.tag }}"
          git push
